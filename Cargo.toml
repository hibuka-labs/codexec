[package]
name = "codexec"
version = "0.2.0"
edition = "2024"
description = "CodeAct execution layer: code cells as actions, policy-gated and journaled"
license = "MIT"
repository = "https://github.com/hibuka-labs/codexec"
readme = "README.md"
keywords = ["agent", "capability", "codeact"]
categories = ["development-tools"]

[[bin]]
name = "codexec"
path = "src/bin/codexec.rs"

[dependencies]
phi-cap = { version = "0.1.0", features = ["serde"] }
phi-ns = { version = "0.1.0" }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
    "net",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
